services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_prof
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-profi134}
    volumes:
      - postgres_prof:/var/lib/postgresql/data
      - ./migrations/001_create_outbox_table.up.sql:/docker-entrypoint-initdb.d/001_create_outbox_table.up.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq_prof
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_prof:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 5
  redis:
    image: redis:alpine
    container_name: redis_prof
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prof:/data

  producer:
    build:
      context: .
      dockerfile: apps/producer/dockerfile
    container_name: producer_prof
    ports: 
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
  consumer:
    build:
      context: .
      dockerfile: apps/consumer/dockerfile
    container_name: consumer_prof
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
  worker:
    build:
      context: .
      dockerfile: apps/outbox-worker/dockerfile
    container_name: worker_prof
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_prof:
  rabbitmq_prof:
  redis_prof:
